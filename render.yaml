# Render Blueprint Configuration (Infrastructure as Code)
# Dedicated service: cbmu-backend
# Documentation: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: cbmu-backend
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: ADMIN_PASSWORD
        value: cbmuadmin
      - key: GROQ_API_KEY
        sync: false

